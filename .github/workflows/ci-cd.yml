name: CI/CD Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  DART_SDK: '3.3.0'
  FLUTTER_SDK: '3.19.0'

jobs:
  # Flutter Scaffold CLI Tests
  test-flutter-scaffold:
    name: Test Flutter Scaffold CLI
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ env.DART_SDK }}

      - name: Cache Dart dependencies
        uses: actions/cache@v3
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install dependencies
        run: dart pub get

      - name: Verify formatting
        run: dart format --set-exit-if-changed .

      - name: Analyze code
        run: dart analyze --fatal-infos --fatal-warnings .

      - name: Run unit tests
        run: dart test --coverage=coverage/lcov.info

      - name: Run E2E tests
        run: |
          dart run test/e2e/e2e_runner.dart --quick --verbose

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: coverage/lcov.info
          fail_ci_if_error: true

  # Build Flutter Scaffold CLI
  build-flutter-scaffold:
    name: Build Flutter Scaffold CLI
    runs-on: ${{ matrix.os }}
    needs: test-flutter-scaffold
    if: github.ref == 'refs/heads/main'
    
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ env.DART_SDK }}

      - name: Install dependencies
        run: dart pub get

      - name: Build executable
        run: |
          dart compile exe bin/flutter_scaffold.dart -o bin/flutter_scaffold-${{ runner.os }}

      - name: Create release package
        shell: bash
        run: |
          mkdir -p dist
          cp bin/flutter_scaffold-${{ runner.os }} dist/
          cp README.md dist/
          cp LICENSE dist/
          cp -r lib/src/templates dist/
          tar -czf flutter_scaffold-${{ runner.os }}-${{ github.sha }}.tar.gz -C dist .

      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: flutter_scaffold-${{ runner.os }}
          path: flutter_scaffold-${{ runner.os }}-${{ github.sha }}.tar.gz
          retention-days: 30

  # VS Code Extension Tests
  test-vscode-extension:
    name: Test VS Code Extension
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: vscode-extension

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: vscode-extension

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Lint code
        run: npm run lint

      - name: Compile TypeScript
        run: npm run compile

      - name: Verify extension package
        run: npm run package

  # Build VS Code Extension
  build-vscode-extension:
    name: Build VS Code Extension
    runs-on: ubuntu-latest
    needs: test-vscode-extension
    if: github.ref == 'refs/heads/main'
    
    defaults:
      run:
        working-directory: vscode-extension

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: vscode-extension

      - name: Install dependencies
        run: npm ci

      - name: Package extension
        run: npm run package

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v3
        with:
          name: vscode-extension
          path: '*.vsix'
          retention-days: 30

  # Security Scan
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [test-flutter-scaffold, test-vscode-extension]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'

  # Create Release
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-flutter-scaffold, build-vscode-extension]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v3
        with:
          path: artifacts

      - name: Generate changelog
        id: changelog
        run: |
          # Get the last tag
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          
          # Generate changelog since last tag
          if [ -n "$LAST_TAG" ]; then
            CHANGELOG=$(git log $LAST_TAG..HEAD --pretty=format:"- %s (%h)" --no-merges)
          else
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" --no-merges -10)
          fi
          
          # Save to file for release notes
          echo "$CHANGELOG" > CHANGELOG_RELEASE.md
          
          # Set as output
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Get version
        id: version
        run: |
          VERSION=$(dart run bin/flutter_scaffold.dart --version 2>/dev/null || echo "0.1.0")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: flutter_scaffold v${{ steps.version.outputs.version }}
          body: |
            ## 🚀 Release v${{ steps.version.outputs.version }}
            
            ${{ steps.changelog.outputs.changelog }}
            
            ### 📦 Downloads
            
            #### Flutter Scaffold CLI
            - **Windows**: Download `flutter_scaffold-Windows-${{ github.sha }}.tar.gz`
            - **macOS**: Download `flutter_scaffold-macOS-${{ github.sha }}.tar.gz`
            - **Linux**: Download `flutter_scaffold-Linux-${{ github.sha }}.tar.gz`
            
            #### VS Code Extension
            - Install: `code --install-extension flutter-scaffold-template-*.vsix`
            
            ### 🔧 Installation
            
            ```bash
            # CLI
            dart pub global activate flutter_scaffold
            
            # VS Code Extension
            code --install-extension flutter-scaffold-template-*.vsix
            ```
            
            ### 📚 Documentation
            - [README](https://github.com/jinto-ag/flutter_scaffold/blob/main/README.md)
            - [Contributing Guide](https://github.com/jinto-ag/flutter_scaffold/blob/main/CONTRIBUTING.md)
            - [Security Policy](https://github.com/jinto-ag/flutter_scaffold/blob/main/SECURITY.md)
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.vsix
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, 'beta') || contains(steps.version.outputs.version, 'alpha') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Publish to Pub.dev (manual trigger)
  publish-to-pub:
    name: Publish to Pub.dev
    runs-on: ubuntu-latest
    needs: create-release
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ env.DART_SDK }}

      - name: Install dependencies
        run: dart pub get

      - name: Publish to Pub.dev
        run: dart pub publish --force
        env:
          PUB_TOKEN: ${{ secrets.PUB_TOKEN }}